<!--
  @file src/app.html
  @purpose HTML root template SvelteKit, load Poppins font dan inisialisasi dark mode class
  @usedBy SvelteKit runtime saat render halaman
  @dependencies Google Fonts (Poppins), localStorage & matchMedia untuk deteksi tema
  @publicFunctions N/A (HTML template)
  @sideEffects Menambahkan class 'dark' pada documentElement jika preferensi tema gelap
-->
<!doctype html>
<html lang="id">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
		<script>
			// Deteksi preferensi tema (system default & localStorage) sebelum render untuk hindari flash
			try {
				const storedTheme = localStorage.getItem('theme');
				const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
				if (storedTheme === 'dark' || (!storedTheme && systemPrefersDark)) {
					document.documentElement.classList.add('dark');
				} else {
					document.documentElement.classList.remove('dark');
				}
			} catch (_) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
