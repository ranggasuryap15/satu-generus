<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05A875" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E6F7F0" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Inner Soft Glow Outline -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="6" />

  <!-- App Logo Graphic: Generus Community & Growth Leaf Symbol -->
  <g filter="url(#shadow)" transform="translate(4, 0)">
    <!-- Central Head / Star -->
    <circle cx="252" cy="160" r="42" fill="url(#leafGrad)" />

    <!-- Growth Leaf / Upward Shield Arc (Left) -->
    <path d="M160 360 C150 260, 210 230, 252 230 C240 290, 200 340, 160 360 Z" fill="url(#leafGrad)" opacity="0.95" />

    <!-- Growth Leaf / Upward Shield Arc (Right) -->
    <path d="M344 360 C354 260, 294 230, 252 230 C264 290, 304 340, 344 360 Z" fill="url(#leafGrad)" opacity="0.95" />

    <!-- Main Solid Stem & Base Unity Arc -->
    <path d="M252 245 C252 320, 220 375, 175 400 C220 405, 284 405, 329 400 C284 375, 252 320, 252 245 Z" fill="url(#leafGrad)" />
    
    <!-- Dynamic Islamic Crescent Dot Accent -->
    <circle cx="252" cy="100" r="12" fill="#FFFFFF" opacity="0.8" />
  </g>
</svg>

