# @file docker-compose.yml
# @purpose Orkestrasi development lokal pasca-migrasi: SvelteKit dev server + PostgreSQL 16 dengan healthcheck & volume persisten
# @usedBy Developer lokal: docker compose up -d
# @dependencies Dockerfile (target dev), volume ./uploads, named volume pgdata
# @publicFunctions service: postgres, app
# @sideEffects Mengekspos 5173 (app) & 5432 (db), menulis data DB ke named volume pgdata dan file upload ke ./uploads
services:
  postgres:
    image: postgres:16-alpine
    container_name: satu-generus-db
    environment:
      POSTGRES_USER: satu_generus
      POSTGRES_PASSWORD: satu_generus
      POSTGRES_DB: satu_generus
      TZ: Asia/Jakarta
      PGTZ: Asia/Jakarta
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Hanya untuk inspeksi lokal via GUI (DBeaver/dbx). Di produksi JANGAN diekspos.
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U satu_generus -d satu_generus"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: satu-generus-dev
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
      - HOST=0.0.0.0
      - PORT=5173
      # Aktifkan polling watcher karena bind mount Docker di Linux tidak
      # meneruskan event inotify (HMR tidak mendeteksi perubahan file).
      - CHOKIDAR_USEPOLLING=true
      # Nama host = nama service compose, BUKAN localhost
      - DATABASE_URL=postgres://satu_generus:satu_generus@postgres:5432/satu_generus
    volumes:
      # Mount project untuk Vite hot module reloading
      - .:/app
      # Hindari penimpaan node_modules container oleh host
      - /app/node_modules
      # PENTING: .svelte-kit diisolasi memakai anonymous volume.
      # `npm run build` atau `npm run dev` di HOST akan menghapus &
      # menulis ulang .svelte-kit (generated/dev -> generated/build), yang
      # lewat bind mount `.:/app` membuat dev server container kehilangan
      # .svelte-kit/generated/dev/server.js lalu error:
      #   Failed to load url /.svelte-kit/generated/dev/server.js
      - /app/.svelte-kit
      # File upload disimpan di luar build/static (bukan lagi ./data)
      - ./uploads:/app/uploads
    restart: unless-stopped

volumes:
  pgdata:
